<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Elite Glass Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: radial-gradient(at 0% 0%, #1e293b 0%, #0f172a 50%, #020617 100%);
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Pure High-End Glass */
        .premium-glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        /* Floating Nav - Correct Position */
        .bottom-nav {
            position: absolute;
            bottom: 30px;
            width: 90%;
            max-width: 400px;
            height: 85px;
            border-radius: 35px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        /* Scan Line Ultra Glow */
        .scan-line {
            height: 4px;
            width: 100%;
            background: linear-gradient(90deg, transparent, #00f2fe, #4facfe, transparent);
            position: absolute;
            z-index: 50;
            filter: drop-shadow(0 0 15px #00f2fe);
            animation: scanMove 3s infinite ease-in-out;
        }

        @keyframes scanMove {
            0%, 100% { top: 5%; opacity: 0.3; }
            50% { top: 95%; opacity: 1; }
        }

        /* Click Animation */
        .tap-effect:active {
            transform: scale(0.92);
            transition: 0.1s;
            filter: brightness(1.2);
        }

        #reader { border: none !important; width: 110% !important; height: 110% !important; position: absolute; top: -5%; left: -5%; }
        #reader video { object-fit: cover; }
        
        /* Corner Accents */
        .corner {
            position: absolute;
            width: 35px;
            height: 35px;
            border: 4px solid #00f2fe;
            z-index: 60;
            filter: drop-shadow(0 0 8px #00f2fe);
        }
    </style>
</head>
<body>

    <header class="w-full flex justify-between items-center mt-12 px-8 z-50">
        <div class="premium-glass p-3 rounded-2xl tap-effect">
            <i data-lucide="layout-grid" class="w-6 h-6 text-slate-200"></i>
        </div>
        <h1 class="text-sm font-black tracking-[0.3em] text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
            PRISM v2
        </h1>
        <div class="premium-glass p-3 rounded-2xl tap-effect">
            <i data-lucide="zap" class="w-6 h-6 text-yellow-400"></i>
        </div>
    </header>

    <div class="relative mt-20 w-[300px] h-[300px]">
        <div class="premium-glass w-full h-full rounded-[3rem] overflow-hidden relative">
            <div class="scan-line"></div>
            <div id="reader"></div>
        </div>

        <div class="corner -top-2 -left-2 rounded-tl-2xl border-r-0 border-b-0"></div>
        <div class="corner -top-2 -right-2 rounded-tr-2xl border-l-0 border-b-0"></div>
        <div class="corner -bottom-2 -left-2 rounded-bl-2xl border-r-0 border-t-0"></div>
        <div class="corner -bottom-2 -right-2 rounded-br-2xl border-l-0 border-t-0"></div>
    </div>

    <div id="result-pop" class="premium-glass hidden absolute top-[55%] w-[85%] p-5 rounded-[2rem] z-[110] animate-bounce-in">
        <div class="flex items-center gap-4">
            <div class="bg-cyan-500/20 p-3 rounded-2xl"><i data-lucide="external-link" class="text-cyan-400"></i></div>
            <div class="flex-1 overflow-hidden">
                <p class="text-[10px] uppercase tracking-tighter text-slate-400">Data Detected</p>
                <p id="res-text" class="truncate text-white font-medium italic">Scanning...</p>
            </div>
            <button onclick="copyRes()" class="p-2"><i data-lucide="copy" class="w-5 h-5 text-white/50"></i></button>
        </div>
    </div>

    <nav class="bottom-nav premium-glass">
        <button class="tap-effect p-4"><i data-lucide="clock" class="text-slate-400"></i></button>
        
        <button id="scan-trigger" onclick="initScanner()" class="tap-effect w-20 h-20 -top-6 relative rounded-full bg-gradient-to-br from-cyan-400 to-blue-600 shadow-[0_0_30px_rgba(34,211,238,0.4)] flex items-center justify-center border-4 border-white/10">
            <i data-lucide="scan" class="w-10 h-10 text-white"></i>
        </button>

        <button class="tap-effect p-4"><i data-lucide="settings" class="text-slate-400"></i></button>
    </nav>

    <script>
        lucide.createIcons();
        const html5QrCode = new Html5Qrcode("reader");

        async function initScanner() {
            try {
                if (navigator.vibrate) navigator.vibrate(60);
                
                const config = { 
                    fps: 25, 
                    qrbox: { width: 250, height: 250 },
                    aspectRatio: 1.0 
                };

                await html5QrCode.start(
                    { facingMode: "environment" }, 
                    config, 
                    (decodedText) => {
                        document.getElementById('result-pop').style.display = 'block';
                        document.getElementById('res-text').innerText = decodedText;
                        if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
                    }
                );
                
                document.getElementById('scan-trigger').classList.add('opacity-30');
            } catch (err) {
                alert("Camera Access Required!");
            }
        }

        function copyRes() {
            const t = document.getElementById('res-text').innerText;
            navigator.clipboard.writeText(t);
            alert("Copied!");
        }
    </script>
</body>
</html>
